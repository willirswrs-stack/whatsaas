version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: whatsaas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-wathsaas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whatsaas-network

  redis:
    image: redis:alpine
    container_name: whatsaas-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-wathsaas_redis_2024}
    volumes:
      - redis_data:/data
    networks:
      - whatsaas-network

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolution-api
    restart: always
    environment:
      - SERVER_URL=https://evolution.whatsaas.online
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1035194821
      - AUTH_TYPE=apikey
      - AUTH_API_KEY=${EVOLUTION_API_KEY:-evolution_key_2024}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-wathsaas}?schema=public
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD:-wathsaas_redis_2024}@redis:6379/1
      - RABBITMQ_ENABLED=false
      - WEBSOCKET_ENABLED=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:-wathsaas_redis_2024}@redis:6379/2
      - WEBHOOK_GLOBAL_URL=http://whatsaas-backend:3333/api/v1/webhooks/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_EVENTS=APPLICATION_STARTUP,QRCODE_UPDATED,MESSAGES_SET,MESSAGES_UPSERT,MESSAGES_UPDATE,MESSAGES_DELETE,SEND_MESSAGE,CONTACTS_SET,CONTACTS_UPSERT,CONTACTS_UPDATE,PRESENCE_UPDATE,CHATS_SET,CHATS_UPSERT,CHATS_UPDATE,CHATS_DELETE,GROUPS_UPSERT,GROUP_UPDATE,GROUP_PARTICIPANTS_UPDATE,CONNECTION_UPDATE,CALL,TYPEBOT_START,TYPEBOT_CHANGE_STATUS
    depends_on:
      - postgres
      - redis
    ports:
      - "8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - whatsaas-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsaas-backend
    restart: always
    env_file: .env
    ports:
      - "3333:3333"
    depends_on:
      - postgres
      - redis
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - whatsaas-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.whatsaas.online/api/v1
        - NEXT_PUBLIC_EVOLUTION_URL=https://evolution.whatsaas.online
    container_name: whatsaas-frontend
    restart: always
    env_file: ./frontend/.env.production
    ports:
      - "3000:3000"
    networks:
      - whatsaas-network

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  backend_uploads:

networks:
  whatsaas-network:
    driver: bridge
